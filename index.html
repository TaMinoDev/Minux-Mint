                icon: './icons/nativ/minux_settings.png',

                    const name = Object.keys(programs).find(key => programs[key]["action"] === this.action);
                    openWindow('Settings',250,250,`${name}`);
                    console.log('Open window Settings');
                }
            }, "Milli": {
                icon: './icons/nativ/milli.png',
                script: './scripts/nativ/text_editor.js',
                action() {
                    const name = Object.keys(programs).find(key => programs[key]["action"] === this.action);
                    openWindow('Milli',500,500,`${name}`);
                }
            }
        }

        const directory = {
            "*": {
                "home": {
                    "minux": {
                        "desktop": {
                            "install Minux": {
                                type: 'exe',
                                action() {
                                    installMinux();
                                }
                            }
                        },
                        ".config": {
                            "style.config": '{"bg": "./pictures/background/pic2.jpg"}',
                        }
                    }
                }
            }
        }

        async function openWindow(windowTitle = 'new window',width = 250,height = 250,src) {
            if(document.getElementById('menu')) {
                openMenu();
            }
            console.log(src);
            const content = programs[src].content;
            const win = document.createElement('div');
            win.className = 'window';
            win.innerHTML = `<div class="window-bar">${windowTitle}<button onclick="this.parentElement.parentElement.remove()" class="close-btn">x</button></div>`;
            win.innerHTML += content;
            win.style = `position: fixed; top: 50vh; left: 50vw; background-color: white; padding: 1px solid black;`;
            document.body.appendChild(win);
            programs[src].onOpen?.(win);
            console.log(content);
            console.log('window succesfully opened');
            
            const drag = win.querySelector('.window-bar');
            let isDragging = false;
            let offsetX, offsetY;
            drag.onmousedown = (e) => {
                isDragging = true;
                
                drag.style.userSelect = 'none';

                offsetX = e.clientX - drag.parentElement.offsetLeft;
                offsetY = e.clientY - drag.parentElement.offsetTop;
                
                drag.parentElement.style.zIndex += 2;
                drag.style.cursor = 'grabbing';
                drag.style.zIndex += 2;
            };
            document.addEventListener('mousemove',(e) => {
                if (!isDragging) return;

                let x = e.clientX - offsetX;
                let y = e.clientY - offsetY;

                drag.parentElement.style.left = `${x}px`;
                drag.parentElement.style.top = `${y}px`;
            });

            document.addEventListener('mouseup',() => {
                if (isDragging) {
                    isDragging = false;
                    drag.style.zIndex--;
                    drag.parentElement.style.zIndex--;
                    drag.style.userSelect = '';
                    drag.style.cursor = 'grab';
                }
            });
        }

        function startTaskbar() {
            running["minux-taskbar-starter"] = {
                started: new Date(),
                by: 'root'
            }
            for(t in taskbarContent) {
                const item = document.createElement('img');
                item.src = taskbarContent[t].icon;
                item.style = 'width: auto; height: 7vh;';
                item.className = 'taskbar-item';
                item.title = taskbarContent[t].dis;
                item.onclick = () => taskbarContent[t].action();
                taskbar.appendChild(item);
            }
            delete running?.["minux-taskbar-starter"];
        }

        function loadBackground() {
            let path = JSON.parse(directory["*"]["home"]["minux"][".config"]["style.config"])["bg"];
            console.log(path);
            screen.style.backgroundImage = `url('${path}')`;
            screen.style.backgroundSize = 'cover';
        }

        function openMenu() {
            if(!document.getElementById('menu')) {
                const menu = document.createElement('div');
                menu.id = 'menu';
                menu.className = 'menu';
                document.body.appendChild(menu);
                for(program in programs) {
                    const entry = document.createElement('div');
                    entry.innerHTML = `<img src="${programs[program].icon}" onclick="programs['${program}'].action()"><span>${program}</span>`;
                    entry.className = 'menu-entry';
                    menu.appendChild(entry);
                    menu.appendChild(document.createElement('hr'));
                }
            } else {
                document.getElementById('menu').remove();
            }
        }

        window.onload = () => {

        function getValueByPath(obj, pathString) {
        const keys = pathString.match(/[^[\]'"]+/g);
        
        if (!keys) return undefined;
        return keys.reduce((current, key) => current?.[key], obj);
        }

        screen.onclick = () => {
            if(document.getElementById('menu')) {
                openMenu();
            }
        }
